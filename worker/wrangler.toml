name = "cinequeue-api"
main = "src/index.js"
compatibility_date = "2026-08-20"

[[d1_databases]]
binding = "DB"
database_name = "cinequeue"
database_id = "e8fd9017-45e1-4abb-aa97-32e9db8ffbf1"

# No [[ratelimits]] binding here on purpose: it deploys and reports success on
# this account but never actually counts (verified with limit=1/10s letting four
# back-to-back requests through), so auth throttling is counted in D1 instead.
#
# Secrets (wrangler secret put … — never commit values):
#   SESSION_SECRET         — required; signs user login sessions
#   TMDB_READ_TOKEN        — required for GET /api/tmdb (account-gated TMDB proxy)
#   ADMIN_PASSWORD         — optional; admin UI login password
#   ADMIN_SESSION_SECRET   — optional; signs admin bearer tokens (required with ADMIN_PASSWORD)
#   ALLOWED_ORIGINS        — optional; extra CORS origins, comma-separated
#   NETLIFY_PROXY_SIGNING_SECRET — optional; must match the `signed` env var in
#     netlify.toml. Without it X-Forwarded-For is trusted on the weaker
#     x-nf-request-id check, which a direct caller can forge to dodge rate limits.
#
# Signup uses one-time invite codes in D1 (invite_codes table). Generate from #admin.
